<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1200" viewBox="0 0 1440 1200" role="img" aria-labelledby="t d">
  <title id="t">Anatomy of a daily handout</title>
  <desc id="d">A miniature printed handout page with callouts: the technique named in plain words, a ten-minute warm-up drill from her own sentences, a ten-minute freewrite, a mini-lesson with a mentor text, one labeled writing assignment with countable requirements, a self-checkable checklist that later becomes the evaluation rubric, a stretch, and a cut-out pocket card.</desc>
  <defs>
    <radialGradient id="vg" cx="40%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#161A17"/>
      <stop offset="100%" stop-color="#111412"/>
    </radialGradient>
    <style>
      .sc    { font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 600; letter-spacing: .16em; }
      .sans  { font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .serif { font-family: Newsreader, Georgia, 'Times New Roman', serif; }
      .mono  { font-family: 'IBM Plex Mono', 'SF Mono', Menlo, Consolas, monospace; }
      .it    { font-style: italic; }
      .bar   { fill: #DAD5C6; }
      .con   { stroke: #3E4540; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1440" height="1200" fill="url(#vg)"/>

  <!-- ============ header ============ -->
  <text class="sc" x="720" y="82" font-size="21" fill="#757A72" text-anchor="middle">A LIVING CURRICULUM · THE DAILY ARTIFACT</text>
  <text class="serif" x="720" y="130" font-size="40" fill="#E5E4DC" text-anchor="middle">Anatomy of a handout</text>

  <!-- ============ the page ============ -->
  <rect x="134" y="214" width="620" height="830" rx="6" fill="#0A0C0A" opacity="0.55"/>
  <rect x="120" y="200" width="620" height="830" rx="6" fill="#F8F6F0"/>

  <!-- mini header -->
  <text class="sc" x="166" y="248" font-size="13" fill="#3e6b4f">THE WRITING COURSE · LESSON 4 · TECHNIQUE</text>
  <text class="serif" x="166" y="288" font-size="30" fill="#1f3a5f">Dialogue: the four rules</text>
  <text class="serif it" x="166" y="314" font-size="16.5" fill="#6b675c">By the end of today, you can punctuate any conversation.</text>
  <text class="sans" x="166" y="338" font-size="12.5" fill="#6b675c">Friday, Aug 7 · Warm-up 10 · Freewrite 10 · Lesson 10 · Writing 40 min</text>
  <line x1="166" y1="352" x2="694" y2="352" stroke="#ddd8cc" stroke-width="1.5"/>
  <line x1="166" y1="356" x2="694" y2="356" stroke="#ddd8cc" stroke-width="1.5"/>

  <!-- 1 warm-up -->
  <text class="sans" x="166" y="390" font-size="15.5" font-weight="700" fill="#1f3a5f"><tspan fill="#3e6b4f">1 · </tspan>Warm-up (10 min): rewrite three of your sentences</text>
  <rect class="bar" x="166" y="402" width="528" height="8" rx="4"/>
  <rect class="bar" x="166" y="418" width="370" height="8" rx="4"/>
  <line x1="166" y1="444" x2="694" y2="444" stroke="#C9C3B2" stroke-width="1.5"/>
  <line x1="166" y1="464" x2="694" y2="464" stroke="#C9C3B2" stroke-width="1.5"/>

  <!-- 2 freewrite -->
  <text class="sans" x="166" y="496" font-size="15.5" font-weight="700" fill="#1f3a5f"><tspan fill="#3e6b4f">2 · </tspan>Freewrite (10 min): any topic, no rules</text>
  <rect class="bar" x="166" y="508" width="528" height="8" rx="4"/>
  <rect class="bar" x="166" y="524" width="318" height="8" rx="4"/>

  <!-- 3 lesson -->
  <text class="sans" x="166" y="556" font-size="15.5" font-weight="700" fill="#1f3a5f"><tspan fill="#3e6b4f">3 · </tspan>Lesson: dialogue punctuation, shown working</text>
  <g>
    <rect x="166" y="568" width="528" height="72" rx="4" fill="#f1efe7"/>
    <rect x="166" y="568" width="4" height="72" fill="#1f3a5f"/>
    <rect class="bar" x="186" y="584" width="480" height="7" rx="3.5"/>
    <rect class="bar" x="186" y="600" width="480" height="7" rx="3.5"/>
    <rect class="bar" x="186" y="616" width="296" height="7" rx="3.5"/>
  </g>

  <!-- 4 assignment -->
  <text class="sans" x="166" y="672" font-size="15.5" font-weight="700" fill="#1f3a5f"><tspan fill="#3e6b4f">4 · </tspan>Writing Assignment: The Reunion Scene</text>
  <g>
    <rect x="166" y="684" width="528" height="104" rx="4" fill="#e9efe9"/>
    <rect x="166" y="684" width="4" height="104" fill="#3e6b4f"/>
    <rect class="bar" x="186" y="700" width="480" height="7" rx="3.5"/>
    <rect class="bar" x="186" y="716" width="436" height="7" rx="3.5"/>
    <circle cx="192" cy="739" r="2.5" fill="#3e6b4f"/>
    <rect class="bar" x="204" y="735" width="400" height="7" rx="3.5"/>
    <circle cx="192" cy="757" r="2.5" fill="#3e6b4f"/>
    <rect class="bar" x="204" y="753" width="356" height="7" rx="3.5"/>
    <circle cx="192" cy="775" r="2.5" fill="#3e6b4f"/>
    <rect class="bar" x="204" y="771" width="380" height="7" rx="3.5"/>
  </g>

  <!-- 5 checklist -->
  <text class="sans" x="166" y="820" font-size="15.5" font-weight="700" fill="#1f3a5f"><tspan fill="#3e6b4f">5 · </tspan>Checklist</text>
  <text x="166" y="843" font-size="15" fill="#3e6b4f">☐</text>
  <rect class="bar" x="192" y="833" width="380" height="7" rx="3.5"/>
  <text x="166" y="863" font-size="15" fill="#3e6b4f">☐</text>
  <rect class="bar" x="192" y="853" width="420" height="7" rx="3.5"/>
  <text x="166" y="883" font-size="15" fill="#3e6b4f">☐</text>
  <rect class="bar" x="192" y="873" width="348" height="7" rx="3.5"/>

  <!-- 6 stretch -->
  <text class="sans" x="166" y="916" font-size="15.5" font-weight="700" fill="#1f3a5f"><tspan fill="#3e6b4f">6 · </tspan>Stretch</text>
  <rect class="bar" x="166" y="928" width="528" height="8" rx="4"/>
  <rect class="bar" x="166" y="944" width="238" height="8" rx="4"/>

  <!-- pocket card -->
  <text class="sans" x="430" y="972" font-size="12" fill="#9a958a" text-anchor="middle">✂ — — — — — — — — — — — — — — — — — — — — — — — — — ✂</text>
  <g>
    <rect x="166" y="982" width="528" height="40" rx="6" fill="#F8F6F0" stroke="#3e6b4f" stroke-width="2"/>
    <text class="sc" x="186" y="1000" font-size="11" fill="#3e6b4f">POCKET CARD — THE FOUR RULES</text>
    <rect class="bar" x="186" y="1008" width="300" height="6" rx="3"/>
  </g>

  <!-- ============ callouts ============ -->
  <!-- header -->
  <circle cx="746" cy="282" r="3.5" fill="#565D57"/>
  <line class="con" x1="746" y1="282" x2="830" y2="282"/>
  <text class="sc" x="846" y="288" font-size="17" fill="#A9ACA2">THE TECHNIQUE, NAMED IN PLAIN WORDS</text>
  <text class="serif it" x="846" y="318" font-size="21" fill="#9FA29A">one nameable move per day — if you can't name it</text>
  <text class="serif it" x="846" y="344" font-size="21" fill="#9FA29A">in five words, it isn't ready to print</text>

  <!-- 01 warm-up -->
  <circle cx="746" cy="428" r="3.5" fill="#565D57"/>
  <line class="con" x1="746" y1="428" x2="830" y2="428"/>
  <text class="sc" x="846" y="434" font-size="17" fill="#8FC0A0">WARM-UP · 10 MIN</text>
  <text class="serif it" x="846" y="464" font-size="21" fill="#9FA29A">a sentence drill built from her own sentences,</text>
  <text class="serif it" x="846" y="490" font-size="21" fill="#9FA29A">aimed at an active tracker item</text>

  <!-- 02 freewrite -->
  <circle cx="746" cy="516" r="3.5" fill="#565D57"/>
  <line class="con" x1="746" y1="516" x2="830" y2="516"/>
  <text class="sc" x="846" y="522" font-size="17" fill="#8FC0A0">FREEWRITE · 10 MIN</text>
  <text class="serif it" x="846" y="552" font-size="21" fill="#9FA29A">never graded, no rules — turned in with the day's work</text>

  <!-- 03 lesson -->
  <circle cx="746" cy="604" r="3.5" fill="#565D57"/>
  <line class="con" x1="746" y1="604" x2="830" y2="604"/>
  <text class="sc" x="846" y="610" font-size="17" fill="#8FC0A0">MINI-LESSON + MENTOR TEXT</text>
  <text class="serif it" x="846" y="640" font-size="21" fill="#9FA29A">the technique shown working in a book she loves</text>

  <!-- 04 assignment -->
  <circle cx="746" cy="736" r="3.5" fill="#565D57"/>
  <line class="con" x1="746" y1="736" x2="830" y2="736"/>
  <text class="sc" x="846" y="742" font-size="17" fill="#8FC0A0">WRITING ASSIGNMENT</text>
  <text class="serif it" x="846" y="772" font-size="21" fill="#9FA29A">one labeled container; specific, countable</text>
  <text class="serif it" x="846" y="798" font-size="21" fill="#9FA29A">requirements; sized by the Challenge dial</text>

  <!-- 05 checklist -->
  <circle cx="746" cy="852" r="3.5" fill="#565D57"/>
  <line class="con" x1="746" y1="852" x2="830" y2="852"/>
  <text class="sc" x="846" y="858" font-size="17" fill="#8FC0A0">CHECKLIST</text>
  <text class="serif it" x="846" y="888" font-size="21" fill="#9FA29A">3–4 self-checkable criteria — /evaluate reads</text>
  <text class="serif it" x="846" y="914" font-size="21" fill="#9FA29A">these later as the piece's rubric</text>

  <!-- 06 stretch -->
  <circle cx="746" cy="936" r="3.5" fill="#565D57"/>
  <line class="con" x1="746" y1="936" x2="830" y2="936"/>
  <text class="sc" x="846" y="942" font-size="17" fill="#8FC0A0">STRETCH</text>
  <text class="serif it" x="846" y="972" font-size="21" fill="#9FA29A">a real challenge, printed as part of the day</text>

  <!-- pocket card -->
  <circle cx="746" cy="1002" r="3.5" fill="#565D57"/>
  <line class="con" x1="746" y1="1002" x2="812" y2="1002"/>
  <line class="con" x1="812" y1="1002" x2="812" y2="1036"/>
  <line class="con" x1="812" y1="1036" x2="830" y2="1036"/>
  <text class="sc" x="846" y="1042" font-size="17" fill="#A9ACA2">POCKET CARD</text>
  <text class="serif it" x="1036" y="1042" font-size="19" fill="#757A72">— cut out, kept at her desk</text>

  <!-- ============ caption ============ -->
  <text class="serif it" x="720" y="1124" font-size="23" fill="#9FA29A" text-anchor="middle">One self-contained HTML file — reads well on screen, prints correctly from the browser,</text>
  <text class="serif it" x="720" y="1154" font-size="23" fill="#9FA29A" text-anchor="middle">and the checklist doubles as the next evaluation's rubric.</text>
</svg>
